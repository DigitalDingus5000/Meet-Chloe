<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet Chloe — Chapter One</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hud-bar">
    <div class="hud-stats">
      <div class="hud-item"><span class="hud-label">Social Read</span><span class="hud-value" id="hud-social-read">You are a nobody</span></div>
      <div class="hud-item"><span class="hud-label">Cash</span><span class="hud-value" id="hud-cash">$120</span></div>
      <div class="hud-item"><span class="hud-label">Grades</span><span class="hud-value" id="hud-grades">B</span></div>
    </div>
    <div class="hud-actions">
      <button type="button" class="hud-btn" id="btn-open-dm">Messages <span class="dm-badge" id="dm-unread-badge">0</span></button>
      <button type="button" class="hud-btn" id="btn-restart">New Run</button>
    </div>
  </header>

  <main class="bookplate-frame">
    <section class="bookplate-inner">
      <div class="scene-header">
        <div class="scene-chapter" id="scene-chapter"></div>
        <h1 class="scene-title" id="scene-title"></h1>
        <div class="beat-pill" id="beat-indicator" style="display:none;"></div>
      </div>
      <article class="narrative-body" id="narrative-body"></article>
      <div class="choices-deck" id="choices-deck"></div>
    </section>
  </main>

  <aside class="dm-overlay" id="dm-overlay">
    <div class="dm-drawer">
      <div class="dm-drawer-header">
        <span class="dm-drawer-title">Campus Correspondence</span>
        <button type="button" class="hud-btn" id="btn-close-dm">Close</button>
      </div>
      <div id="dm-threads-container"></div>
    </div>
  </aside>

  <script src="characters.js"></script>
  <script src="engine.js"></script>
  <script src="episode1.js"></script>
  <script src="episode2_part1.js"></script>
  <script src="episode2_part2.js"></script>
  <script src="game.js"></script>
</body>
</html>
